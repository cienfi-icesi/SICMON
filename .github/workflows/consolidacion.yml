    env:
      # --- Canales de datos ---
      # Drive apagado: su autenticación es OAuth de usuario y solo se obtiene
      # abriendo un navegador, cosa que un runner no puede hacer. El canal real
      # es la hoja del Apps Script, que va con token y no con credencial de
      # Google. Ver README, «Por qué Drive está apagado en la nube».
      SICMON_CONECTAR_DRIVE: 'false'
      SICMON_CONECTAR_HOJA:  'true'
      SICMON_PUBLICAR_HOJA:  'true'

      # El token de extracción entra por aquí y nunca toca el disco.
      SICMON_TOKEN_EXPORTACION: ${{ secrets.TOKEN_EXPORTACION }}

      # El volcado del tablero lleva salud y coordenadas: se queda en el runner
      # y muere con él. No se publica ni se guarda.
      SICMON_CARPETA_TABLERO: data/salida/tablero

      # El log de este job es público. Esto tacha las secuencias de 7 o más
      # dígitos (cédulas) antes de imprimirlas.
      SICMON_LOG_REDACTAR: 'true'

      # --- Estado entre corridas ---
      ESTADO_REPO:  ${{ secrets.ESTADO_REPO }}
      ESTADO_TOKEN: ${{ secrets.ESTADO_TOKEN }}
      ESTADO_CLAVE: ${{ secrets.ESTADO_CLAVE }}

      # --- R ---
      # Los paquetes se instalan aquí y no en la biblioteca del sistema. Cada
