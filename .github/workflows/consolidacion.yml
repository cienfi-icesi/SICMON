##============================================================================##
# Consolidación — corrida automática del pipeline de R
#------------------------------------------------------------------------------#
# Reemplaza al launchd que corría en un solo Mac (scheduler/*.plist). El flujo es
# el mismo de siempre; lo único que cambia es de dónde sale y a dónde vuelve la
# base, porque el runner arranca vacío en cada corrida:
#
#   repo privado de estado  →  descifrar  →  pipeline  →  cifrar  →  repo privado
#                                              ↓
#                              hoja de Google (pestañas c_*)  →  app_consulta
#
# QUÉ NO SALE DE AQUÍ
# Este repositorio es público y el registro de ejecución de este workflow
# también. Por eso la base viaja cifrada, nunca se sube como artefacto y los
# logs del pipeline se redactan (SICMON_LOG_REDACTAR) antes de imprimirse.
##============================================================================##
