# ============================================================================
#  Consolidación cada 10 minutos, en los servidores de GitHub.
#
#  QUÉ HACE
#  Baja de la hoja de Google lo que llegó del campo, lo consolida (duplicados,
#  emparejamiento hogar-edificación) y devuelve el resultado a las pestañas c_*
#  de la misma hoja, que es de donde lo lee el aplicativo de consulta.
#
#  POR QUÉ AQUÍ Y NO EN UN EQUIPO
#  Antes esto corría con launchd en el portátil de CIENFI. Dos problemas: si el
#  equipo estaba apagado la consulta se quedaba vieja sin avisar, y macOS
#  bloquea el acceso de los agentes de launchd a ~/Desktop y ~/Documents, que es
#  donde vivía el repositorio (fallaba con "Operation not permitted" y código
#  78). Aquí no depende de ninguna máquina de nadie.
#
#  POR QUÉ ES GRATIS
#  Los repositorios públicos no consumen minutos en los ejecutores estándar.
#  Esto solo se sostiene mientras el repositorio siga siendo público, y solo
#  puede ser público porque los datos personales NO viven aquí: viven en la
#  hoja de Google. Si algún día se vuelve privado, esta frecuencia costaría del
#  orden de US$50-80 al mes.
#
#  LO QUE HAY QUE CONFIGURAR UNA SOLA VEZ
#  Settings → Secrets and variables → Actions → New repository secret:
#    TOKEN_EXPORTACION   la misma cadena de la propiedad TOKEN_EXPORTACION del
