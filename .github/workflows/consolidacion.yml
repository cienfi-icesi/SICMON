##============================================================================##
# Consolidación — corrida automática del pipeline de R
#------------------------------------------------------------------------------#
# Reemplaza al launchd que corría en un solo Mac (scheduler/*.plist). El flujo es
# el mismo de siempre; lo único que cambia es de dónde sale y a dónde vuelve la
# base, porque el runner arranca vacío en cada corrida:
#
#   repo privado de estado  →  descifrar  →  pipeline  →  cifrar  →  repo privado
#                                              ↓
#                              hoja de Google (pestañas c_*)  →  app_consulta
#
# POR QUÉ ES GRATIS
# Los repositorios públicos no consumen minutos en los ejecutores estándar. Esto
# solo se sostiene mientras el repositorio siga siendo público, y solo puede
# serlo porque los datos personales NO viven aquí: viven en la hoja de Google.
#
# QUÉ NO SALE DE AQUÍ
# Este repositorio es público y el registro de ejecución de este workflow
# también. Por eso la base viaja cifrada, nunca se sube como artefacto y los
# logs del pipeline se redactan (SICMON_LOG_REDACTAR) antes de imprimirse.
#
# El estado se guarda en un repo privado (no en la caché de Actions): la caché
# se desaloja tras 7 días sin uso, y este estado —historial campo a campo,
# bitácora de duplicados— es justo lo que no puede perderse entre corridas.
##============================================================================##

name: Consolidación

on:
  # (1) Aviso del Apps Script cuando detecta filas nuevas en la hoja. Es el
  #     camino normal: corre cuando hay algo que consolidar y no antes.
  repository_dispatch:
    types: [hoja_actualizada]

  # (2) Respaldo por reloj, por si el disparador de Google falla o se
  #     desactiva. Cada 10 minutos, todos los días, a toda hora.
  #
  #     POR QUÉ NO SE LIMITA AL HORARIO LABORAL
  #     Antes era de lunes a viernes, 07:00–18:00 de Bogotá. Un sismo no espera
  #     al lunes: con esa ventana, una brigada que sale un sábado veía la
  #     consulta congelada hasta el lunes por la mañana, sin que nada avisara.
  #     Los repositorios públicos no consumen minutos de Actions, así que
  #     restringir la ventana no ahorraba nada y sí dejaba un hueco de 62 horas
  #     cada fin de semana.
  #
  #     OJO CON LA PUNTUALIDAD: GitHub no garantiza la hora de un `schedule`.
  #     En horas de carga alta los encola y se saltan corridas; diez minutos
  #     pedidos pueden ser veinte reales. Quien da la actualización rápida es el
  #     repository_dispatch de arriba, que llega en segundos. Este cron es la
  #     red de seguridad, no el mecanismo principal.
  schedule:
    - cron: '*/10 * * * *'

  # (3) A mano, desde la pestaña Actions. Para una corrida fuera de horario,
  #     para probar un cambio sin esperar al cron y —importante— para reactivar
  #     el cron: GitHub desactiva los workflows programados tras 60 días sin
  #     commits en el repositorio.
  workflow_dispatch:

# Dos corridas simultáneas se pisarían: las dos escribirían las pestañas c_* de
# la hoja y las dos subirían su versión de la base. Se encolan.
# cancel-in-progress en falso a propósito: cancelar a media corrida dejaría el
# consolidado a medio publicar en la hoja.
concurrency:
  group: consolidacion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  consolidar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: consolidacion

    env:
      # --- Canales de datos ---
      # Drive apagado: su autenticación es OAuth de usuario y solo se obtiene
      # abriendo un navegador, cosa que un runner no puede hacer. El canal real
      # es la hoja del Apps Script, que va con token y no con credencial de
      # Google. (run_pipeline.R además detecta GITHUB_ACTIONS y se salta Drive,
      # 04 y 05 por su cuenta; esto es el cinturón además del tirante.)
      SICMON_CONECTAR_DRIVE: 'false'
      SICMON_CONECTAR_HOJA:  'true'
      SICMON_PUBLICAR_HOJA:  'true'

      # El token de extracción entra por aquí y nunca toca el disco.
      SICMON_TOKEN_EXPORTACION: ${{ secrets.TOKEN_EXPORTACION }}

      # El volcado del tablero lleva salud y coordenadas: se queda en el runner
      # y muere con él. No se publica ni se guarda.
      SICMON_CARPETA_TABLERO: data/salida/tablero

      # El log de este job es público. Esto tacha las secuencias de 7 o más
      # dígitos (cédulas) antes de imprimirlas.
      SICMON_LOG_REDACTAR: 'true'

      # --- Estado entre corridas ---
      ESTADO_REPO:  ${{ secrets.ESTADO_REPO }}
      ESTADO_TOKEN: ${{ secrets.ESTADO_TOKEN }}
      ESTADO_CLAVE: ${{ secrets.ESTADO_CLAVE }}

      # --- R ---
      # Los paquetes se instalan aquí y no en la biblioteca del sistema. Cada
      # paso del pipeline corre en su propio Rscript (run_pipeline.R los lanza
      # con system2) y todos heredan esta variable, así que todos ven la misma
      # biblioteca sin necesidad de un .Rprofile que activaría renv también en
      # los equipos del equipo.
      R_LIBS_USER: ${{ github.workspace }}/.rlib

      # Binarios de Ubuntu en vez de compilar desde el fuente: la instalación
      # baja de ~20 minutos a menos de 2. renv respeta esta variable por encima
      # del repositorio anotado en renv.lock.
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Librerías del sistema
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev zlib1g-dev

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      # La llave incluye el hash de renv.lock: mientras el lockfile no cambie,
      # la biblioteca se restaura de la caché y el paso siguiente no baja nada.
      - name: Caché de paquetes
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r450-${{ hashFiles('consolidacion/renv.lock') }}
          restore-keys: ${{ runner.os }}-r450-

      - name: Instalar los paquetes del lockfile
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), showWarnings = FALSE, recursive = TRUE)
          .libPaths(Sys.getenv("R_LIBS_USER"))
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore(lockfile = "renv.lock",
                        library  = Sys.getenv("R_LIBS_USER"),
                        prompt   = FALSE)

      # Sin este paso la base se crearía de cero y 01_ingest.R volvería a marcar
      # como «insertado» todo lo que ya estaba consolidado.
      - name: Recuperar el estado de la corrida anterior
        run: bash tools/estado_descargar.sh

      - name: Ejecutar el pipeline
        run: Rscript pipeline/run_pipeline.R

      # Solo si el pipeline terminó bien. Si falló a mitad, la base del runner
      # se descarta y la próxima corrida parte de la última buena: la ingestión
      # detecta cambios por hash, así que reprocesar lo mismo da el mismo
      # resultado y no duplica nada. Guardar un estado a medias sí sería un
      # problema, porque no hay forma de saber hasta dónde alcanzó a llegar.
      - name: Guardar el estado
        run: bash tools/estado_guardar.sh

      # Ninguna de estas comprobaciones mira los datos: miran qué quedó escrito
      # donde no debía. Corre siempre, incluso si el pipeline falló, porque un
      # fallo a media corrida es justo cuando pueden quedar archivos sueltos.
      - name: Verificar que no quedó nada sensible en el árbol público
        if: always()
        run: bash tools/verificar_publico.sh
